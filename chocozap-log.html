<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チョコザップログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f5f7ef;
    --surface: #ffffff;
    --surface-2: #eef1e3;
    --text: #15190f;
    --text-muted: #5c6353;
    --line: #dfe4d2;
    --accent: #b6e61c;
    --accent-ink: #1a2400;
    --run: #3163e0;
    --run-soft: #e8eefd;
    --gym-soft: #eef8cf;
    --machine: #8452d8;
    --machine-soft: #efe7fb;
    --danger: #d94b4b;
    --danger-soft: #fbe7e6;
    --shadow: 0 1px 2px rgba(20, 24, 12, 0.04), 0 6px 16px rgba(20, 24, 12, 0.05);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e100a;
      --surface: #181b12;
      --surface-2: #20241750;
      --text: #edf1e2;
      --text-muted: #9aa38b;
      --line: #2a2f1e;
      --accent: #c3f53c;
      --accent-ink: #131a02;
      --run: #7ea3ff;
      --run-soft: #1c2740;
      --gym-soft: #26301496;
      --machine: #b79dfb;
      --machine-soft: #2a2140;
      --danger: #ff8a8a;
      --danger-soft: #3a1f1f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0e100a;
    --surface: #181b12;
    --surface-2: #20241750;
    --text: #edf1e2;
    --text-muted: #9aa38b;
    --line: #2a2f1e;
    --accent: #c3f53c;
    --accent-ink: #131a02;
    --run: #7ea3ff;
    --run-soft: #1c2740;
    --gym-soft: #26301496;
    --machine: #b79dfb;
    --machine-soft: #2a2140;
    --danger: #ff8a8a;
    --danger-soft: #3a1f1f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding-inline: 16px;
    padding-block: 20px 48px;
  }

  .display {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 900;
    letter-spacing: 0.01em;
  }

  .wrap {
    max-width: 640px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  header.top .titles h1 {
    font-size: clamp(22px, 5vw, 28px);
    margin: 0;
    text-wrap: balance;
  }

  header.top .titles p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .mode-note {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (min-width: 520px) {
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow);
  }

  .stat-tile .icon {
    width: 22px;
    height: 22px;
    color: var(--accent-icon, var(--text-muted));
  }

  .stat-tile .icon.gym { color: #7a9a00; }
  .stat-tile .icon.run { color: var(--run); }
  .stat-tile .icon.streak { color: #e08a2b; }
  .stat-tile .icon.total { color: var(--text-muted); }

  .stat-tile .value {
    font-size: 22px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .stat-tile .value .unit {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-left: 2px;
  }

  .stat-tile .label {
    font-size: 11px;
    color: var(--text-muted);
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn[aria-selected="true"] {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .tab-btn .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .tab-btn.gym .dot { background: var(--accent); }
  .tab-btn.run .dot { background: var(--run); }
  .tab-btn.machine .dot { background: var(--machine); }

  .add-row {
    display: flex;
    justify-content: flex-end;
  }

  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:focus-visible, .tab-btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid var(--run);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }

  .btn-primary.run-theme {
    background: var(--run);
    color: #fff;
  }

  .btn-primary.machine-theme {
    background: var(--machine);
    color: #fff;
  }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-muted);
  }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .form-card h2 {
    margin: 0;
    font-size: 15px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
  }

  .field input, .field textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
    width: 100%;
  }

  .field textarea { resize: vertical; min-height: 44px; }

  .field input:focus, .field textarea:focus {
    outline: 2px solid var(--run);
    outline-offset: 1px;
  }

  .mini-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    font-family: inherit;
    font-size: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 6px 11px;
    cursor: pointer;
  }

  .chip:hover { color: var(--text); }

  .form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 2px;
  }

  .month-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .month-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    padding-left: 2px;
    font-variant-numeric: tabular-nums;
  }

  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .entry-card {
    display: flex;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    align-items: center;
  }

  .entry-stripe {
    width: 4px;
    align-self: stretch;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .entry-card.gym .entry-stripe { background: var(--accent); }
  .entry-card.run .entry-stripe { background: var(--run); }
  .entry-card.machine .entry-stripe { background: var(--machine); }

  .best-tag {
    font-size: 10px;
    font-weight: 700;
    background: var(--machine-soft);
    color: var(--machine);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 4px;
  }

  .machine-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .machine-chip.active {
    background: var(--machine);
    border-color: transparent;
    color: #fff;
  }

  .custom-input-row {
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }

  .custom-input-row input {
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 11px;
    width: 120px;
  }

  .machine-summary {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .machine-summary-name {
    font-weight: 700;
    font-size: 15px;
  }

  .machine-summary-last, .machine-summary-best {
    font-size: 12px;
    color: var(--text-muted);
  }

  .machine-summary-last b, .machine-summary-best b {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .view-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    width: fit-content;
  }

  .view-toggle-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .view-toggle-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .entry-main { flex: 1; min-width: 0; }

  .entry-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .entry-date {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .entry-title {
    font-weight: 700;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .entry-stats {
    display: flex;
    gap: 12px;
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .entry-stats b {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  .entry-memo {
    margin-top: 4px;
    font-size: 12px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
  }

  .entry-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }

  .icon-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
  }

  .icon-btn[data-del]:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .icon-btn[data-edit]:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  .icon-btn svg { width: 16px; height: 16px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 10px;
    padding: 28px 16px;
    border: 1px dashed var(--line);
    border-radius: var(--radius-lg);
    color: var(--text-muted);
  }

  .empty-state .icon { width: 30px; height: 30px; color: var(--text-muted); }
  .empty-state p { margin: 0; font-size: 13px; max-width: 34ch; }

  .example-card {
    opacity: 0.55;
    pointer-events: none;
    position: relative;
  }

  .example-tag {
    font-size: 10px;
    font-weight: 700;
    background: var(--surface-2);
    color: var(--text-muted);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 4px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding-top: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="titles">
      <h1 class="display">チョコザップログ</h1>
      <p>マシントレーニングとランニングをまとめて記録</p>
    </div>
    <span class="mode-note" id="modeNote" hidden></span>
  </header>

  <section class="stat-grid" id="statGrid" aria-label="サマリー"></section>

  <nav class="tabs" role="tablist" aria-label="記録の種類">
    <button class="tab-btn gym" id="tabGymBtn" role="tab"><span class="dot"></span>ジム記録</button>
    <button class="tab-btn run" id="tabRunBtn" role="tab"><span class="dot"></span>ラン</button>
    <button class="tab-btn machine" id="tabMachineBtn" role="tab"><span class="dot"></span>マシン</button>
  </nav>

  <div id="machinePickerHost"></div>

  <div class="add-row">
    <button class="btn btn-primary" id="addToggleBtn">＋ 記録を追加</button>
  </div>

  <div id="formHost"></div>

  <section class="entry-list" id="entryHost" aria-live="polite"></section>

  <footer>記録はクラウドに保存され、このページのURLを知っている人からは読み書きできます。</footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  var firebaseConfig = {
    apiKey: "AIzaSyDnpadQXe0UZWlUUNkxibOIbQwJXXwpj-A",
    authDomain: "chocozap-log.firebaseapp.com",
    projectId: "chocozap-log",
    storageBucket: "chocozap-log.firebasestorage.app",
    messagingSenderId: "582766373182",
    appId: "1:582766373182:web:e733bbfd813974420e246f"
  };

(function () {
  "use strict";

  var ICONS = {
    dumbbell: '<svg class="icon gym" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6M2 10.5v3M7 7v10M17 7v10M20 10.5v3M22 9v6M7 12h10"/></svg>',
    run: '<svg class="icon run" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="5" r="1.8" fill="currentColor" stroke="none"/><path d="M12.5 8.5l2 3-3 2.2.5 4.3M14.5 11.5l3.5 1.3-1 3.7M8.5 13l-3 1.5v3.5M10.5 8l-3.5 2"/></svg>',
    flame: '<svg class="icon streak" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-3 4-3 7.5A3.5 3.5 0 0 0 12 13a2 2 0 0 0 2-2c1.2.9 2 2.4 2 4a4 4 0 0 1-8 0c0-3 1.5-4.5 2-6 .3-1 .2-2-1-2.5C10 4.5 11 3 12 2z"/></svg>',
    calendar: '<svg class="icon total" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 12a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-12"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'
  };

  var GYM_CHIPS = ["筋トレ", "ながらウォーク", "エアロバイク", "AIストレッチ", "セルフエステ", "ヨガ"];

  var MACHINES = [
    "①ショルダープレス", "②チェストプレス", "③ラットプルダウン", "④バックエクステンション",
    "⑤アブドミナル", "⑥レッグプレス", "⑦レッグエクステンション", "⑧レッグカール",
    "⑨アブダクション", "⑩アダクション"
  ];

  var gymDocs = [];
  var runDocs = [];
  var machineDocs = [];
  var firestoreDb = null;
  var mode = "loading";
  var activeTab = "gym";
  var formOpen = false;
  var selectedMachine = null;
  var customInputOpen = false;
  var editingId = null;
  var machineListMode = "machine";

  function todayStr() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d.getTime() - tz).toISOString().slice(0, 10);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function saveLocal() {
    try {
      localStorage.setItem("chocozaplog_gym", JSON.stringify(gymDocs));
      localStorage.setItem("chocozaplog_runs", JSON.stringify(runDocs));
      localStorage.setItem("chocozaplog_machines", JSON.stringify(machineDocs));
    } catch (e) {}
  }

  function allMachineOptions() {
    var seen = {};
    var list = [];
    function add(name) {
      if (name && !seen[name]) { seen[name] = true; list.push(name); }
    }
    MACHINES.forEach(add);
    try {
      JSON.parse(localStorage.getItem("chocozaplog_custom_machines") || "[]").forEach(add);
    } catch (e) {}
    machineDocs.forEach(function (d) { add(d.machine); });
    return list;
  }

  function sortDesc(arr) {
    arr.sort(function (a, b) { return (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0); });
  }

  function subscribeCollection(name, cb) {
    var q = query(collection(firestoreDb, name), orderBy("date", "desc"));
    onSnapshot(q, function (snap) {
      var docs = [];
      snap.forEach(function (d) { docs.push(Object.assign({ id: d.id }, d.data())); });
      cb(docs);
    }, function (err) { console.error(name + " snapshot error", err); });
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  async function signInWithRetry(auth, attempts) {
    var lastErr = null;
    for (var i = 0; i < attempts; i++) {
      try {
        await new Promise(function (resolve, reject) {
          var timeout = setTimeout(function () { reject(new Error("auth timeout")); }, 8000);
          var unsub = onAuthStateChanged(auth, function (user) {
            if (user) { clearTimeout(timeout); unsub(); resolve(); }
          });
          signInAnonymously(auth).catch(function (err) { clearTimeout(timeout); reject(err); });
        });
        return true;
      } catch (e) {
        lastErr = e;
        if (i < attempts - 1) await sleep(600 * (i + 1));
      }
    }
    throw lastErr;
  }

  async function initFirebase() {
    try {
      var app = initializeApp(firebaseConfig);
      var auth = getAuth(app);
      firestoreDb = getFirestore(app);
      await signInWithRetry(auth, 3);
      return true;
    } catch (e) {
      console.error("Firebase init failed", e);
      return false;
    }
  }

  async function initData() {
    try { selectedMachine = localStorage.getItem("chocozaplog_selected_machine") || null; } catch (e) {}
    var ok = await initFirebase();
    if (ok) {
      mode = "firebase";
      subscribeCollection("gym", function (docs) { gymDocs = docs; render(); });
      subscribeCollection("runs", function (docs) { runDocs = docs; render(); });
      subscribeCollection("machines", function (docs) { machineDocs = docs; render(); });
    } else {
      mode = "local";
      try { gymDocs = JSON.parse(localStorage.getItem("chocozaplog_gym") || "[]"); } catch (e) { gymDocs = []; }
      try { runDocs = JSON.parse(localStorage.getItem("chocozaplog_runs") || "[]"); } catch (e) { runDocs = []; }
      try { machineDocs = JSON.parse(localStorage.getItem("chocozaplog_machines") || "[]"); } catch (e) { machineDocs = []; }
      sortDesc(gymDocs);
      sortDesc(runDocs);
      sortDesc(machineDocs);
    }
    render();
  }

  function formatPace(paceMinPerKm) {
    if (!isFinite(paceMinPerKm) || paceMinPerKm <= 0) return "-";
    var m = Math.floor(paceMinPerKm);
    var s = Math.round((paceMinPerKm - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return m + "'" + String(s).padStart(2, "0") + '"';
  }

  function monthLabel(dateStr) {
    var parts = (dateStr || "").split("-");
    if (parts.length < 2) return "その他";
    return parts[0] + "年" + parseInt(parts[1], 10) + "月";
  }

  function computeStats() {
    var ym = todayStr().slice(0, 7);
    var thisMonthGym = gymDocs.filter(function (d) { return (d.date || "").slice(0, 7) === ym; }).length;
    var thisMonthDistance = runDocs
      .filter(function (d) { return (d.date || "").slice(0, 7) === ym; })
      .reduce(function (sum, d) { return sum + (Number(d.distance) || 0); }, 0);

    var dateSet = {};
    gymDocs.forEach(function (d) { if (d.date) dateSet[d.date] = true; });
    runDocs.forEach(function (d) { if (d.date) dateSet[d.date] = true; });
    machineDocs.forEach(function (d) { if (d.date) dateSet[d.date] = true; });
    var totalDays = Object.keys(dateSet).length;

    var streak = 0;
    var cursor = new Date(todayStr() + "T00:00:00");
    if (!dateSet[todayStr()]) cursor.setDate(cursor.getDate() - 1);
    while (true) {
      var y = cursor.getFullYear();
      var m = String(cursor.getMonth() + 1).padStart(2, "0");
      var day = String(cursor.getDate()).padStart(2, "0");
      var key = y + "-" + m + "-" + day;
      if (dateSet[key]) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }

    return { thisMonthGym: thisMonthGym, thisMonthDistance: thisMonthDistance, totalDays: totalDays, streak: streak };
  }

    var host = document.getElementById("formHost");

    if (activeTab === "gym") host.innerHTML = gymFormHtml();
    else if (activeTab === "run") host.innerHTML = runFormHtml();
    else host.innerHTML = machineFormHtml();

    if (activeTab === "gym") {
      var editingGym = editingId ? gymDocs.find(function (d) { return d.id === editingId; }) : null;
      document.getElementById("gymDate").value = editingGym ? editingGym.date : todayStr();
      document.getElementById("gymDuration").value = editingGym ? editingGym.duration : "";

      document.getElementById("gymMemo").value = editingGym ? (editingGym.memo || "") : "";
      document.getElementById("gymCancel").addEventListener("click", function () { formOpen = false; editingId = null; render(); });
      host.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.getElementById("gymMenu").value = chip.dataset.chip;
        });
      });
      document.getElementById("gymForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var date = document.getElementById("gymDate").value;
        var duration = Number(document.getElementById("gymDuration").value);
        var menu = document.getElementById("gymMenu").value.trim();
        var memo = document.getElementById("gymMemo").value.trim();

        var data = { date: date, duration: duration, menu: menu, memo: memo };
        if (editingGym) {
          updateGym(editingGym.id, data);
        } else {
          data.createdAt = Date.now();
          addGym(data);
        }
        formOpen = false;
        editingId = null;
        render();
      });
    } else if (activeTab === "run") {
      var editingRun = editingId ? runDocs.find(function (d) { return d.id === editingId; }) : null;
      document.getElementById("runDate").value = editingRun ? editingRun.date : todayStr();
      document.getElementById("runDistance").value = editingRun ? editingRun.distance : "";

        var sec = Number(document.getElementById("runSec").value) || 0;

        groups.push({ label: label, items: [] });

    return groups.map(function (g) {

        '<div class="month-group">' +

          g.items.map(cardFn).join("") +

    }).join("");

    var week = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
    return parseInt(parts[1], 10) + "月" + parseInt(parts[2], 10) + "日(" + week + ")";
  }

    );
  }

  function renderEntries() {
    var host = document.getElementById("entryHost");
    if (activeTab === "gym") {
      host.innerHTML = gymDocs.length ? groupedList(gymDocs, gymEntryCard) : emptyGym();
    } else if (activeTab === "run") {
      host.innerHTML = runDocs.length ? groupedList(runDocs, runEntryCard) : emptyRun();
    } else if (machineListMode === "day") {
      if (machineDocs.length) {
        host.innerHTML = groupedByDay(machineDocs, dayEntryCard(computeBestWeights()));
      } else {
        host.innerHTML = (
          '<div class="empty-state">' + ICONS.dumbbell +
            '<p>まだマシンの記録がありません。「＋ 記録を追加」から重さと回数を残しましょう。</p>' +
          '</div>'
        );
      }
    } else {
      var records = machineDocs.filter(function (d) { return d.machine === selectedMachine; });
      if (records.length) {
        var bestWeight = records.reduce(function (mx, d) { return Math.max(mx, Number(d.weight) || 0); }, 0);
        host.innerHTML = groupedList(records, machineEntryCard(bestWeight));
      } else {
        host.innerHTML = (
          '<div class="empty-state">' + ICONS.dumbbell +
            '<p>' + escapeHtml(selectedMachine || "マシン") + ' の記録はまだありません。「＋ 記録を追加」から重さと回数を残しましょう。</p>' +
            '<div class="entry-card machine example-card"><div class="entry-stripe"></div><div class="entry-main">' +
              '<div class="entry-top"><span class="entry-date">' + todayStr() + '</span><span class="entry-title">40kg × 15回<span class="example-tag">例</span></span></div></div></div>' +
          '</div>'
        );
      }
    }
    host.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.dataset.del.split(":");
        removeRecord(parts[0], parts.slice(1).join(":"));
      });
    });
    host.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.dataset.edit.split(":");
        editingId = parts.slice(1).join(":");
        formOpen = true;
        render();
      });
    });
  }

  function renderMachinePicker() {
    var host = document.getElementById("machinePickerHost");
    if (activeTab !== "machine") { host.innerHTML = ""; return; }

    var options = allMachineOptions();
    if (!selectedMachine || options.indexOf(selectedMachine) === -1) {
      selectedMachine = options[0] || null;
      try { localStorage.setItem("chocozaplog_selected_machine", selectedMachine || ""); } catch (e) {}
    }

    var chips = options.map(function (m) {
      var cls = "chip machine-chip" + (m === selectedMachine ? " active" : "");
      return '<button type="button" class="' + cls + '" data-machine="' + escapeHtml(m) + '">' + escapeHtml(m) + '</button>';
    }).join("");

    var customInputHtml = customInputOpen
      ? '<span class="custom-input-row"><input type="text" id="customMachineInput" placeholder="マシン名"><button type="button" class="btn btn-ghost" id="customMachineAdd">追加</button></span>'
      : "";

    var records = machineDocs.filter(function (d) { return d.machine === selectedMachine; });
    sortDesc(records);
    var last = records[0];
    var bestWeight = records.reduce(function (mx, d) { return Math.max(mx, Number(d.weight) || 0); }, 0);

    var summaryHtml = selectedMachine ? (
      '<div class="machine-summary">' +
        '<div class="machine-summary-name">' + escapeHtml(selectedMachine) + '</div>' +
        (last
          ? '<div class="machine-summary-last">前回: <b>' + escapeHtml(last.weight) + 'kg</b> × <b>' + escapeHtml(last.reps) + '回</b>' + (last.sets > 1 ? ' ×' + escapeHtml(last.sets) + 'セット' : '') + ' <span>(' + escapeHtml(last.date) + ')</span></div>'
          : '<div class="machine-summary-last">まだ記録がありません</div>') +
        (bestWeight ? '<div class="machine-summary-best">自己ベスト <b>' + bestWeight + 'kg</b></div>' : "") +
      '</div>'
    ) : "";

    var toggleHtml =
      '<div class="view-toggle">' +
        '<button type="button" class="view-toggle-btn' + (machineListMode === "machine" ? " active" : "") + '" data-view="machine">選択中のマシン</button>' +
        '<button type="button" class="view-toggle-btn' + (machineListMode === "day" ? " active" : "") + '" data-view="day">日付でまとめて表示</button>' +
      '</div>';

    host.innerHTML =
      '<div class="machine-picker">' + chips +
        '<button type="button" class="chip chip-add" id="machineCustomBtn">＋ その他</button>' +
        customInputHtml +
      '</div>' + summaryHtml + toggleHtml;

    host.querySelectorAll(".view-toggle-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        machineListMode = btn.dataset.view;
        render();
      });
    });

    host.querySelectorAll(".machine-chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        selectedMachine = chip.dataset.machine;
        try { localStorage.setItem("chocozaplog_selected_machine", selectedMachine); } catch (e) {}
        formOpen = false;
        editingId = null;
        customInputOpen = false;
        render();
      });
    });

    document.getElementById("machineCustomBtn").addEventListener("click", function () {
      customInputOpen = !customInputOpen;
      render();
    });

    if (customInputOpen) {
      var input = document.getElementById("customMachineInput");
      input.focus();
      var commit = function () {
        var name = input.value.trim();
        if (name) {
          try {
            var customs = JSON.parse(localStorage.getItem("chocozaplog_custom_machines") || "[]");
            if (customs.indexOf(name) === -1) {
              customs.push(name);
              localStorage.setItem("chocozaplog_custom_machines", JSON.stringify(customs));
            }
          } catch (e) {}
          selectedMachine = name;
          try { localStorage.setItem("chocozaplog_selected_machine", selectedMachine); } catch (e) {}
        }
        customInputOpen = false;
        render();
      };
      document.getElementById("customMachineAdd").addEventListener("click", commit);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); commit(); }
      });
    }
  }

  function renderModeNote() {
    var note = document.getElementById("modeNote");
    if (mode === "local") {
      note.hidden = false;
      note.textContent = "このブラウザのみに保存";
    } else {
      note.hidden = true;
    }
  }

  function render() {
    renderStats();
    renderTabs();
    renderMachinePicker();
    renderForm();
    renderEntries();
    renderModeNote();
  }

  document.getElementById("tabGymBtn").addEventListener("click", function () { activeTab = "gym"; formOpen = false; editingId = null; render(); });
  document.getElementById("tabRunBtn").addEventListener("click", function () { activeTab = "run"; formOpen = false; editingId = null; render(); });
  document.getElementById("tabMachineBtn").addEventListener("click", function () { activeTab = "machine"; formOpen = false; editingId = null; customInputOpen = false; render(); });
  document.getElementById("addToggleBtn").addEventListener("click", function () {
    formOpen = !formOpen;
    if (formOpen) editingId = null;
    render();
  });

  render();
  initData();
})();
</script>
</body>
</html>
